readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "vision-agents[openai]>=0.6.6",
  "vision-agents-plugins-getstream>=0.6.6",
  "python-dotenv>=1.0.0",
]

[project.scripts]
duolingo-vision-agent = "main:main"
